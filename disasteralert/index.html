<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disaster Alert System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🌪️ Disaster Alert System</h1>
  <div id="alerts">
    <p class="placeholder">No active alerts. Messages will appear here when sent.</p>
  </div>

  <h2>📨 Send Emergency Message</h2>
  <form id="messageForm">
    <label for="messageInput">Emergency Message</label>
    <input 
      type="text" 
      id="messageInput" 
      placeholder="Enter detailed emergency message" 
      required 
    />
    <label for="priority">Priority Level</label>
    <select id="priority">
      <option value="high">🔴 High Priority - Immediate Action Required</option>
      <option value="medium">🟡 Medium Priority - Important Notice</option>
      <option value="low">🟢 Low Priority - General Information</option>
    </select>
    <button type="submit">📢 Send Alert</button>
  </form>

  <script src="script.js">
    document.addEventListener("DOMContentLoaded", () => {
  fetch("/alerts")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("alerts");
      data.forEach(alert => {
        const div = document.createElement("div");
        div.innerHTML = `<strong>${alert.type}</strong>: ${alert.message}`;
        container.appendChild(div);
      });
    });

  const form = document.getElementById("messageForm");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = document.getElementById("messageInput").value;
    const priority = document.getElementById("priority").value;

    await fetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, priority })
    });

    alert("Message sent with priority: " + priority);
    form.reset();
  });
});
  </script>
</body>
</html>
